[platformio]
# CI runs a bare `pio run`, so anything listed here is what gets build coverage.
# The fan controller is the product and is listed first. It was previously absent
# from default_envs -- CI built three e-ink room-node envs and never once
# compiled the firmware this repo exists to ship.
default_envs = feather_esp32s2_fan_controller, feather_esp32s2_fan_rehearsal

# Garage fan MQTT controller: the ESP32 replaces the iLiving wall controller.
# Speed 0-12 via garage/fan/set; see docs/fan_protocol/PROTOCOL.md.
[env:feather_esp32s2_fan_controller]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient @ ^2.8
  adafruit/Adafruit BME280 Library @ ^2.2.4
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  adafruit/Adafruit BusIO @ ^1.17.2
  adafruit/Adafruit MAX1704X @ ^1.0.3
  adafruit/Adafruit LC709203F @ ^1.1.1
  adafruit/Adafruit EPD @ ^4.6.0
  adafruit/Adafruit SHT4x Library @ ^1.0.5
  sensirion/Sensirion I2C SGP41 @ ^1.0.0
  sensirion/Sensirion Gas Index Algorithm @ ^3.2.3
  adafruit/Adafruit GFX Library @ ^1.12.1
; WARN level + the IDF log path, so driver failures (the SD library's dying
; words especially) reach eventlog::capture_esp_logs()'s vprintf hook instead
; of being compiled out. ERROR-only hid every sd_diskio log_w behind a bare
; "mount failed" while a healthy card refused to mount (2026-08-09).
build_flags =
  -DCORE_DEBUG_LEVEL=2
  -DUSE_ESP_IDF_LOG
; The Feather ESP32-S2's 2 MB PSRAM chip, unused until 2026-08-09. Internal
; RAM cannot host FATFS (~13 KB contiguous) alongside WiFi+web+MQTT -- the
; board went unreachable the first time the SD card actually mounted. With
; PSRAM, big allocations land there instead. Harmless when absent: the
; prebuilt libs ship SPIRAM_IGNORE_NOTFOUND, so boot just logs a warning.
  -DBOARD_HAS_PSRAM
; build_src_flags, not build_flags: these apply to src/ only. Putting -Wall on
; build_flags would also compile the Arduino framework and the Adafruit libs
; with it, burying our own warnings under thousands we cannot fix. CI re-runs
; the build with -Werror appended (PLATFORMIO_BUILD_SRC_FLAGS overrides this
; line), so a new warning fails the PR rather than scrolling past.
build_src_flags = -Wall -Wextra
; Pre-scripts must run under SCons, which exec()s them with __name__ set to
; "SCons.Script" -- see the entry-point guard at the bottom of the generator.
; gen_device_header.py writes src/generated_config.h from the repo-root .env and
; config/device.yaml; a clone without .env builds with empty credentials.
extra_scripts =
  pre:../../scripts/gen_device_header.py
  pre:../../scripts/gen_web_page.py
  pre:../../scripts/gen_wire_keys.py
build_src_filter = -<*> +<fan_controller_main.cpp> +<fan/control.cpp> +<net/> +<sensors/> +<storage/> +<system/> +<ui/>

; Fan-controller rehearsal: standalone PWM replay for the garage fan takeover.
; Drives A0/A1 through the BSS138 shifter; see docs/fan_protocol/PROTOCOL.md.
[env:feather_esp32s2_fan_rehearsal]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
build_src_flags = -Wall -Wextra
build_src_filter = -<*> +<fan/rehearsal_main.cpp>

; ---------------------------------------------------------------------------
; Native (host) test envs. scripts/test-native.sh discovers every [env:native*]
; here automatically, so a new env is picked up without editing the script or
; the CI job.
; ---------------------------------------------------------------------------

; Shared settings for every native (host) test env below. Each [env:native_*]
; adds only its test_filter; scripts and CI still discover them by name.
[native_base]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I src
test_framework = unity

; The fan auto-mode differential thermostat (pure header).
[env:native_fan_auto]
extends = native_base
test_filter = test_fan_auto

; The OTA rollback decision (boot_health.h). Pure header.
[env:native_boot_health]
extends = native_base
test_filter = test_boot_health

; The 24 h sample ring (storage/ring_logic.h). Pure header.
[env:native_storage_ring]
extends = native_base
test_filter = test_storage_ring

; The battery sliding window and sticky charging verdict
; (sensors/battery_logic.h). Pure header.
[env:native_battery_logic]
extends = native_base
test_filter = test_battery_logic

; The rolling sensor mean that de-noises the auto-mode inputs
; (sensors/rolling.h). Pure header.
[env:native_rolling_avg]
extends = native_base
test_filter = test_rolling_avg

; The single-source outdoor reading: poll mean + expiry (sensors/outdoor.h).
; Pure header -- this is the input the differential thermostat subtracts.
[env:native_outdoor_feed]
extends = native_base
test_filter = test_outdoor_feed

; The fan-cycling profile over the plug meter (net/plug_cycle.h). Pure header.
[env:native_plug_cycle]
extends = native_base
test_filter = test_plug_cycle

; Bounded fixed-point rendering for log lines (system/fixed_fmt.h). Pure
; header: the reason -Wformat-truncation can check that a telemetry line fits.
[env:native_fixed_fmt]
extends = native_base
test_filter = test_fixed_fmt

; The meter window, trace ring and telemetry line (net/plug_window.h). Pure
; header -- includes the pin that the worst-case line fits the 80-byte budget.
[env:native_plug_window]
extends = native_base
test_filter = test_plug_window

; The flight recorder's RAM line ring (system/eventlog_ring.h). Pure header.
[env:native_eventlog_ring]
extends = native_base
test_filter = test_eventlog_ring

[env:native_line_reader]
extends = native_base
test_filter = test_line_reader

; The daily-runtime accounting: local-midnight rollover and the split of a
; tick that spans it (system/odometer_logic.h). Pure header.
[env:native_odometer_logic]
extends = native_base
test_filter = test_odometer_logic

; The flight recorder's benign-noise gate (system/log_filter.h). Pure header.
[env:native_log_filter]
extends = native_base
test_filter = test_log_filter

; The SD purge bookkeeping: the bounded de-duplicating directory queue, the
; rescan-termination rule and the leftover accounting (storage/purge_logic.h).
; Pure header. Two bugs here panicked the deployed board on 2026-08-11.
[env:native_purge_logic]
extends = native_base
test_filter = test_purge_logic

; Climate CSV row decoding, including the six-field rows written before
; 1.14.23 and the -999 absent sentinels (storage/csv_row.h). Pure header.
[env:native_csv_row]
extends = native_base
test_filter = test_csv_row

; HTTP chunked-transfer framing (net/chunked_writer.h). Pure header, templated
; on the sink so the exact wire bytes can be asserted on the host. Every
; response too big for RAM -- history, the CSV export -- goes through it.
[env:native_chunked_writer]
extends = native_base
test_filter = test_chunked_writer

; The CSRF Origin guard on every mutating route (net/origin_check.h). Pure
; header. POST-only alone does not stop a cross-origin form submit.
[env:native_origin_check]
extends = native_base
test_filter = test_origin_check

; The RTC breadcrumb ring (system/crumb_ring.h). Pure struct; the RTC instance
; lives in the .cpp. This is the evidence the next crash depends on, and its
; first version shipped a bug that silently disabled it within a minute.
[env:native_crumb_ring]
extends = native_base
test_filter = test_crumb_ring

; Streaming base64 for the display mirror (net/base64_stream.h). Pure header.
[env:native_base64_stream]
extends = native_base
test_filter = test_base64_stream

; What the e-ink panel says: formatting, staleness and the refresh cadence
; (ui/display_layout.h). Pure header.
[env:native_display_layout]
extends = native_base
test_filter = test_display_layout

; The fixed V1-L QR encoder for the panel's console link (ui/qr_v1.h). Pure
; header; matrices pinned to the same segno reference as tests/test_qr_v1.py.
[env:native_qr_v1]
extends = native_base
test_filter = test_qr_v1
