[platformio]
# CI runs a bare `pio run`, so anything listed here is what gets build coverage.
# The fan controller is the product and is listed first. It was previously absent
# from default_envs -- CI built three e-ink room-node envs and never once
# compiled the firmware this repo exists to ship.
default_envs = feather_esp32s2_fan_controller, feather_esp32s2_fan_rehearsal

# Garage fan MQTT controller: the ESP32 replaces the iLiving wall controller.
# Speed 0-12 via garage/fan/set; see docs/fan_protocol/PROTOCOL.md.
[env:feather_esp32s2_fan_controller]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient @ ^2.8
  adafruit/Adafruit BME280 Library @ ^2.2.4
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  adafruit/Adafruit BusIO @ ^1.17.2
  adafruit/Adafruit MAX1704X @ ^1.0.3
  adafruit/Adafruit LC709203F @ ^1.1.1
  adafruit/Adafruit EPD @ ^4.6.0
  adafruit/Adafruit GFX Library @ ^1.12.1
build_flags =
  -DCORE_DEBUG_LEVEL=1
; build_src_flags, not build_flags: these apply to src/ only. Putting -Wall on
; build_flags would also compile the Arduino framework and the Adafruit libs
; with it, burying our own warnings under thousands we cannot fix. CI re-runs
; the build with -Werror appended (PLATFORMIO_BUILD_SRC_FLAGS overrides this
; line), so a new warning fails the PR rather than scrolling past.
build_src_flags = -Wall -Wextra
; Pre-scripts must run under SCons, which exec()s them with __name__ set to
; "SCons.Script" -- see the entry-point guard at the bottom of the generator.
; gen_device_header.py writes src/generated_config.h from the repo-root .env and
; config/device.yaml; a clone without .env builds with empty credentials.
extra_scripts =
  pre:../../scripts/gen_device_header.py
  pre:../../scripts/gen_web_page.py
build_src_filter = -<*> +<fan_controller_main.cpp> +<fan/control.cpp> +<sensors/> +<storage/> +<system/> +<ui/>

; Fan-controller rehearsal: standalone PWM replay for the garage fan takeover.
; Drives A0/A1 through the BSS138 shifter; see docs/fan_protocol/PROTOCOL.md.
[env:feather_esp32s2_fan_rehearsal]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
build_src_flags = -Wall -Wextra
build_src_filter = -<*> +<fan/rehearsal_main.cpp>

; ---------------------------------------------------------------------------
; Native (host) test envs. scripts/test-native.sh discovers every [env:native*]
; here automatically, so a new env is picked up without editing the script or
; the CI job.
; ---------------------------------------------------------------------------

; The fan auto-mode differential thermostat (pure header).
[env:native_fan_auto]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I src
test_framework = unity
test_filter = test_fan_auto

; The OTA rollback decision (boot_health.h). Pure header.
[env:native_boot_health]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I src
test_framework = unity
test_filter = test_boot_health
