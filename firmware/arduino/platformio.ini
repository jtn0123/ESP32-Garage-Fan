[platformio]
# CI runs a bare `pio run`, so anything listed here is what gets build coverage.
default_envs = feather_esp32s2_display_only, feather_esp32s2_headless, feather_esp32s2_always_on

[env:feather_esp32s2]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps =
  ZinggJM/GxEPD2 @ ^1.5.0
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit BusIO @ ^1.16.1
  bblanchon/ArduinoJson @ ^7
  knolleary/PubSubClient @ ^2.8
  adafruit/Adafruit BME280 Library @ ^2.2.4
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  adafruit/Adafruit MAX1704X @ ^1.0.3
  adafruit/Adafruit LC709203F @ ^1.1.1
  adafruit/Adafruit NeoPixel @ ^1.12.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DEINK_WIDTH=250 -DEINK_HEIGHT=122
  -DUSE_STATUS_PIXEL=0
  -DUSE_UI_SPEC=1
  -DMQTT_MAX_PACKET_SIZE=1024
  -DUSE_MAX17048=1
  -DWIFI_COUNTRY=\"US\"
  -DSCRIPT_GEN_ICONS=0

; Pre-scripts must run under SCons, which exec()s them with __name__ set to
; "SCons.Script" -- see the entry-point guards at the bottom of each generator.
; gen_layout_header.py is deliberately absent: it writes src/display_layout.h with
; unprefixed rect names (HEADER_NAME), while gen_ui.py writes the same file with the
; RECT_-prefixed names display_layout_aliases.h expects. Two writers for one file
; means whichever ran last decided whether the firmware compiled. gen_ui.py owns
; display_layout.h; gen_layout_header.py stays a standalone CLI tool.
extra_scripts =
  pre:../../scripts/gen_device_header.py
  pre:../../scripts/gen_ui.py
build_src_filter = +<*> -<adafruit_fwtest.cpp>


[env:feather_esp32s2_headless]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps = ${env:feather_esp32s2.lib_deps}
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DUSE_DISPLAY=0
  -DEINK_WIDTH=250 -DEINK_HEIGHT=122
  -DUSE_STATUS_PIXEL=1
  -DWIFI_CONNECT_TIMEOUT_MS=20000
  -DMQTT_MAX_PACKET_SIZE=1024
  -DUSE_MAX17048=1
  -DWIFI_COUNTRY=\"US\"
  ${sysenv.EXTRA_FLAGS}
extra_scripts = ${env:feather_esp32s2.extra_scripts}
# diagnostic_test.cpp stays in the build: it provides show_boot_stage(), which
# app_controller.cpp calls unconditionally, and the status pixel is the only boot
# feedback available with USE_DISPLAY=0.
build_src_filter = +<*> -<adafruit_fwtest.cpp> -<display_manager.cpp> -<display_renderer.cpp> -<ui_generated.cpp>



[env:feather_esp32s2_display_only]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps = ${env:feather_esp32s2.lib_deps}
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DUSE_DISPLAY=1
  -DEINK_WIDTH=250 -DEINK_HEIGHT=122
  -DUSE_STATUS_PIXEL=1
  -DUSE_UI_SPEC=1
  -DMQTT_MAX_PACKET_SIZE=1024
  -DUSE_MAX17048=1
  -DWIFI_COUNTRY=\"US\"
  -DFORCE_FULL_ONLY=1
  ; Feature flags - uncomment to disable features and reduce flash size:
  ; -DFEATURE_HA_DISCOVERY=0
  ; -DFEATURE_PROFILING=0
  ; -DFEATURE_DEBUG_COMMANDS=0
  ${sysenv.EXTRA_FLAGS}
extra_scripts = ${env:feather_esp32s2.extra_scripts}
build_src_filter = +<*> -<adafruit_fwtest.cpp>

; Always-on build: the device stays powered, samples every SAMPLE_INTERVAL_SEC
; and remains reachable for network OTA. Intended for USB-powered nodes -- see
; docs/ALWAYS_ON_AND_OTA.md for the battery tradeoff.
[env:feather_esp32s2_always_on]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps = ${env:feather_esp32s2.lib_deps}
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DALWAYS_ON=1
  -DSAMPLE_INTERVAL_SEC=300
  ; Per-unit calibration for the deployed office node (2026-07-30):
  ; residual self-heat after the 80 MHz / modem-sleep mitigation, against
  ; the owner's reading of 72-73 F at steady state (raw sensor sits ~25.5 C
  ; when the room is ~22.5 C). Pack is two parallel 3300 mAh 18650s
  ; (6600 mAh -> APA 0x56, see BATTERY_APA in config.h).
  -DTEMP_OFFSET_C=-3.0f
  -DBATTERY_APA=0x56
  -DFEATURE_USB_MSC=1
  -DUSE_DISPLAY=1
  -DEINK_WIDTH=250 -DEINK_HEIGHT=122
  -DUSE_STATUS_PIXEL=1
  -DUSE_UI_SPEC=1
  -DMQTT_MAX_PACKET_SIZE=1024
  -DUSE_MAX17048=1
  -DWIFI_COUNTRY=\"US\"
  ${sysenv.EXTRA_FLAGS}
extra_scripts = ${env:feather_esp32s2.extra_scripts}
build_src_filter = +<*> -<adafruit_fwtest.cpp>
; To update this build over the network use scripts/deploy.sh <device-ip>,
; which wraps espota.py directly. (pio 6.x dropped --project-option, so the
; old `pio run -t upload --project-option=upload_protocol=espota` advice
; no longer parses.)

[env:dev_display]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps = ${env:feather_esp32s2.lib_deps}
build_flags =
  -DCORE_DEBUG_LEVEL=5
  -DDEV_NO_SLEEP=1
  -DUSE_DISPLAY=1
  -DEINK_WIDTH=250 -DEINK_HEIGHT=122
  -DFORCE_FULL_ONLY=1
  -DUSE_UI_SPEC=1
  -DUSE_STATUS_PIXEL=1
  -DMQTT_MAX_PACKET_SIZE=1024
  -DUSE_MAX17048=1
  -DWIFI_COUNTRY=\"US\"
  ${sysenv.EXTRA_FLAGS}
extra_scripts = ${env:feather_esp32s2.extra_scripts}
build_src_filter = +<*> -<adafruit_fwtest.cpp>

[env:native]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
test_framework = unity
test_filter = test_rounding

; Native test environment for MQTT topic generation
[env:native_mqtt_topics]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
  -I test/native_shim
test_framework = unity
test_filter = test_mqtt_topics

; Native test environment for the smart-refresh module.
; test_build_src=yes + a narrow build_src_filter compiles the real
; display_smart_refresh.cpp rather than a copy of it, so the test cannot drift
; from the implementation.
[env:native_smart_refresh]
platform = native
test_build_src = yes
build_src_filter = +<display_smart_refresh.cpp>
build_flags =
  -std=gnu++17
  -I test/native_shim
  -I src
test_framework = unity
test_filter = test_smart_refresh

; Native test environment for power management
[env:native_power]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
  -I test/native_shim
test_framework = unity
test_filter = test_power

; Native test environment for SD-card config merge semantics
[env:native_config_merge]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
test_framework = unity
test_filter = test_config_merge

; Native test env: app_controller flow logic. The test supplies its own mocks for
; every hardware dependency, so nothing from src/ is compiled.
[env:native_app_controller]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
  -I test/native_shim
test_framework = unity
test_filter = test_app_controller

; Native test env: state_manager. Compiles the real state_manager.cpp; the test
; stubs the handful of NVS helpers it references (they live in system_manager.cpp,
; which needs Preferences).
[env:native_state_manager]
platform = native
test_build_src = yes
build_src_filter = +<state_manager.cpp>
build_flags =
  -std=gnu++17
  -I test/native_shim
  -I src
  -DUSE_DISPLAY=0
test_framework = unity
test_filter = test_state_manager

; Native test env: the pure half of system_manager, via src/system_pure.h
; (reset-reason classification, CRC32). The hardware-touching parts of
; system_manager.cpp -- heap stats, NVS, deep sleep -- cannot build off target and
; need on-target verification instead.
[env:native_system_manager]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
  -I test/native_shim
  -I src
test_framework = unity
test_filter = test_system_manager

; NOTE: there is deliberately no "native_all" env. The native tests do not share
; one build configuration -- test_smart_refresh and test_state_manager compile
; specific files out of src/ via build_src_filter, while the others compile none.
; A single env with test_filter=test_* cannot satisfy both, and the old one
; errored on 2 of 8 tests. Run them all with an explicit env list instead:
;
;   pio test -e native -e native_config_merge -e native_mqtt_topics \
;            -e native_power -e native_smart_refresh -e native_state_manager \
;            -e native_system_manager -e native_app_controller
;
; The same list is in the native-tests job in .github/workflows/ci.yml.

[env:feather_esp32s2_adafruit_fwtest]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit EPD @ ^4.6.0
  adafruit/Adafruit GFX Library @ ^1.12.1
  adafruit/Adafruit BusIO @ ^1.17.2
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DEPD_CS=9 -DEPD_DC=10 -DEPD_BUSY=-1 -DEPD_RST=-1 -DSRAM_CS=-1
  -DDEV_NO_SLEEP=1
build_src_filter = -<*> +<adafruit_fwtest.cpp>


 


; Native test env: the 24h history ring behind the sparkline page. Pure header,
; no shim needed.
[env:native_history_ring]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
test_framework = unity
test_filter = test_history_ring

[env:native_spec_render]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
test_framework = unity
test_filter = test_spec_render
