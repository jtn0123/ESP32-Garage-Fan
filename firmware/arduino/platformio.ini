[platformio]
default_envs = feather_esp32s2_display_only, feather_esp32s2_headless

[env:feather_esp32s2]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps =
  ZinggJM/GxEPD2 @ ^1.5.0
  adafruit/Adafruit GFX Library @ ^1.11.9
  adafruit/Adafruit BusIO @ ^1.16.1
  bblanchon/ArduinoJson @ ^7
  knolleary/PubSubClient @ ^2.8
  adafruit/Adafruit BME280 Library @ ^2.2.4
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  adafruit/Adafruit MAX1704X @ ^1.0.3
  adafruit/Adafruit LC709203F @ ^1.1.1
  adafruit/Adafruit NeoPixel @ ^1.12.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DEINK_WIDTH=250 -DEINK_HEIGHT=122
  -DUSE_STATUS_PIXEL=0
  -DUSE_UI_SPEC=1
  -DMQTT_MAX_PACKET_SIZE=1024
  -DUSE_MAX17048=1
  -DWIFI_COUNTRY=\"US\"
  -DSCRIPT_GEN_ICONS=0

; Pre-scripts must run under SCons, which exec()s them with __name__ set to
; "SCons.Script" -- see the entry-point guards at the bottom of each generator.
; gen_layout_header.py is deliberately absent: it writes src/display_layout.h with
; unprefixed rect names (HEADER_NAME), while gen_ui.py writes the same file with the
; RECT_-prefixed names display_layout_aliases.h expects. Two writers for one file
; means whichever ran last decided whether the firmware compiled. gen_ui.py owns
; display_layout.h; gen_layout_header.py stays a standalone CLI tool.
extra_scripts =
  pre:../../scripts/gen_device_header.py
  pre:../../scripts/gen_ui.py
build_src_filter = +<*> -<adafruit_fwtest.cpp>


[env:feather_esp32s2_headless]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps = ${env:feather_esp32s2.lib_deps}
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DUSE_DISPLAY=0
  -DEINK_WIDTH=250 -DEINK_HEIGHT=122
  -DUSE_STATUS_PIXEL=1
  -DWIFI_CONNECT_TIMEOUT_MS=20000
  -DMQTT_MAX_PACKET_SIZE=1024
  -DUSE_MAX17048=1
  -DWIFI_COUNTRY=\"US\"
  ${sysenv.EXTRA_FLAGS}
extra_scripts = ${env:feather_esp32s2.extra_scripts}
# diagnostic_test.cpp stays in the build: it provides show_boot_stage(), which
# app_controller.cpp calls unconditionally, and the status pixel is the only boot
# feedback available with USE_DISPLAY=0.
build_src_filter = +<*> -<adafruit_fwtest.cpp> -<display_manager.cpp> -<display_renderer.cpp> -<ui_generated.cpp>



[env:feather_esp32s2_display_only]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps = ${env:feather_esp32s2.lib_deps}
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DUSE_DISPLAY=1
  -DEINK_WIDTH=250 -DEINK_HEIGHT=122
  -DUSE_STATUS_PIXEL=1
  -DUSE_UI_SPEC=1
  -DMQTT_MAX_PACKET_SIZE=1024
  -DUSE_MAX17048=1
  -DWIFI_COUNTRY=\"US\"
  -DFORCE_FULL_ONLY=1
  ; Feature flags - uncomment to disable features and reduce flash size:
  ; -DFEATURE_HA_DISCOVERY=0
  ; -DFEATURE_PROFILING=0
  ; -DFEATURE_DEBUG_COMMANDS=0
  ${sysenv.EXTRA_FLAGS}
extra_scripts = ${env:feather_esp32s2.extra_scripts}
build_src_filter = +<*> -<adafruit_fwtest.cpp>

[env:dev_display]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps = ${env:feather_esp32s2.lib_deps}
build_flags =
  -DCORE_DEBUG_LEVEL=5
  -DDEV_NO_SLEEP=1
  -DUSE_DISPLAY=1
  -DEINK_WIDTH=250 -DEINK_HEIGHT=122
  -DFORCE_FULL_ONLY=1
  -DUSE_UI_SPEC=1
  -DUSE_STATUS_PIXEL=1
  -DMQTT_MAX_PACKET_SIZE=1024
  -DUSE_MAX17048=1
  -DWIFI_COUNTRY=\"US\"
  ${sysenv.EXTRA_FLAGS}
extra_scripts = ${env:feather_esp32s2.extra_scripts}
build_src_filter = +<*> -<adafruit_fwtest.cpp>

[env:native]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
test_framework = unity
test_filter = test_rounding

; Native test environment for smart refresh module
[env:native_smart_refresh]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
test_framework = unity
test_filter = test_smart_refresh

; Native test environment for MQTT topic generation
[env:native_mqtt_topics]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
test_framework = unity
test_filter = test_mqtt_topics

; Native test environment for power management
[env:native_power]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
test_framework = unity
test_filter = test_power

; Combined native test environment (runs all native tests)
[env:native_all]
platform = native
test_build_src = no
build_flags =
  -std=gnu++17
test_framework = unity
test_filter = test_*

[env:feather_esp32s2_adafruit_fwtest]
platform = espressif32
board = featheresp32-s2
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit EPD @ ^4.6.0
  adafruit/Adafruit GFX Library @ ^1.12.1
  adafruit/Adafruit BusIO @ ^1.17.2
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DEPD_CS=9 -DEPD_DC=10 -DEPD_BUSY=-1 -DEPD_RST=-1 -DSRAM_CS=-1
  -DDEV_NO_SLEEP=1
build_src_filter = -<*> +<adafruit_fwtest.cpp>


 

