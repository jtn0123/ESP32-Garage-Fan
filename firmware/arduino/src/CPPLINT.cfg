# generated_config.h and generated_page.h are written by the PlatformIO
# pre-scripts during the build, so style findings there are not actionable -
# the next build would undo any fix. Both are gitignored, so they are usually
# absent entirely. generated_page.h in particular is 1100 lines of hex bytes.
#
# This must live in the same directory as the files it names. cpplint matches
# exclude_files against a single path component, walking up from the file toward
# the config: at the repository root the component is "firmware", never the file
# name, so a root-level exclude_files listing paths silently does nothing.
# Filters from the root CPPLINT.cfg still apply (no "set noparent" here).
exclude_files=(generated_config\.h|generated_page\.h)$
