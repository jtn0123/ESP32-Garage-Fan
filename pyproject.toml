[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".github",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["scripts", "tests"]
force-sort-within-sections = true


[tool.mypy]
python_version = "3.11"
namespace_packages = true
# `strict` rather than the individual flags it turns on. scripts/ passed it
# with one finding (an entity id read out of untyped JSON and returned as a
# str), so this is a ratchet against new looseness, not a backlog. It subsumes
# the flags that used to be listed here -- disallow_untyped_defs,
# warn_redundant_casts, warn_unused_ignores, strict_optional -- and adds the
# ones that matter at the JSON boundary this repo lives on: warn_return_any,
# disallow_any_generics, disallow_untyped_calls and strict_equality.
#
# Scope is scripts/ (what CI checks). tests/ is not strict-clean yet.
strict = true
no_implicit_optional = true


[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false
