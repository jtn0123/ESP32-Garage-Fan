[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".github",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["scripts", "tests"]
force-sort-within-sections = true


[tool.mypy]
python_version = "3.11"
namespace_packages = true
warn_redundant_casts = true
warn_unused_ignores = true
# Every def in scripts/ carries annotations as of the quality round; new
# untyped code is a CI failure (the mypy entry in the lint matrix).
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "serial.*",
]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = false
