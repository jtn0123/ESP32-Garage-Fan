name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only by default: no job here writes through GITHUB_TOKEN (they build,
# test and lint, then upload artifacts, which needs no repo scope). A job that
# later needs more should widen it at job scope rather than here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware-build:
    name: Firmware build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-firmware.txt

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/arduino/platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-firmware.txt

      # No manual header generation step here on purpose. platformio.ini's
      # extra_scripts must produce src/generated_config.h during the build, and a
      # manual `python scripts/gen_device_header.py` step masked the fact that the
      # pre-scripts never ran (their entry points only fired for __name__ ==
      # "__main__", which SCons never sets). Deleting the header first makes that
      # failure mode break this job instead of hiding behind the manual step.
      - name: Build fan firmware from a clean checkout
        working-directory: firmware/arduino
        shell: bash
        run: |
          # pipefail matters: without it `tee` supplies the exit status and a
          # failed build would pass this step.
          set -euo pipefail
          # Deleting the generated header first proves the PlatformIO pre-script
          # really does regenerate it, so a clean checkout builds.
          rm -f src/generated_config.h src/generated_page.h
          pio run 2>&1 | tee build.log
          test -s src/generated_config.h
          # gen_web_page.py embeds web/dist/console.html as a gzipped array.
          # If it silently no-ops, the device serves an empty page.
          test -s src/generated_page.h

      # The firmware build is warning-free; keep it that way. Anchored to ^src/
      # so this only covers our own sources -- a dependency that warns from
      # .pio/libdeps/<env>/<lib>/src/... must not fail an unrelated PR.
      #
      # This gate only has teeth because platformio.ini sets
      # `build_src_flags = -Wall -Wextra`. Before that, gcc's defaults emitted
      # almost nothing and the step passed while seven real warnings (uint32_t
      # printed with %u, a dead buffer, two possible snprintf truncations, a
      # bad scanf length modifier) sat in the tree. If those flags are ever
      # removed, this check goes quiet rather than failing -- which is the
      # dangerous direction.
      - name: Check for firmware warnings in our sources
        working-directory: firmware/arduino
        shell: bash
        run: |
          set -uo pipefail
          if grep -E '^src/.*: warning:' build.log > src-warnings.txt; then
            echo "::error::Firmware build produced warnings in src/ (see below)"
            cat src-warnings.txt
            exit 1
          fi
          echo "No warnings in firmware/arduino/src"

      - name: Upload build artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pio-build
          if-no-files-found: warn
          path: |
            firmware/arduino/.pio/build/**/firmware*.bin
            firmware/arduino/.pio/build/**/*.elf
            firmware/arduino/build.log

  web-console:
    name: Web console (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout needs Git auth, so do not leave the token
          # sitting in .git/config where an installed dependency could read it.
          persist-credentials: false

      # One binary instead of node + npm + npx. bun runs the same tools the
      # repo already pins -- tsc, vitest, esbuild via build.mjs, playwright --
      # so nothing about the OUTPUT changes; web/dist/console.html stays
      # byte-identical. Only the runtime and the installer are different.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      # --frozen-lockfile is the `npm ci` guarantee: fail rather than silently
      # resolve something bun.lock did not pin.
      #
      # --ignore-scripts for the same reason the e2e job has it: this runner
      # installs dependencies and then executes them, so a compromised
      # postinstall would run with the workspace in reach. The old `npm ci`
      # here did not have it -- an existing gap this closes in passing.
      # Nothing in this job needs lifecycle scripts: esbuild resolves its
      # platform binary through optionalDependencies, and tsc and vitest are
      # plain bins.
      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        working-directory: web
        run: bun run typecheck

      - name: Unit tests
        working-directory: web
        run: bun run test

      # web/dist/console.html is a committed build artifact: the firmware build
      # runs with only Python and PlatformIO, so `pio run` must never need bun.
      # That trade only holds if the committed copy really is what the source
      # produces -- otherwise the device ships a page nobody can regenerate.
      - name: Rebuild and check the committed bundle is current
        working-directory: web
        run: |
          set -euo pipefail
          bun run build
          if ! git diff --exit-code -- dist/console.html; then
            echo "::error::web/dist/console.html is stale."
            echo "Run 'bun --cwd web run build' and commit the result."
            exit 1
          fi

  # The console driven in a real browser against scripts/mock_device.py, which
  # serves the very bytes checked above -- so this exercises the page that
  # ships, not a dev-server rendering of it. Separate job because installing a
  # browser costs more than the rest of the web job put together, and a red
  # Playwright run should not hide a typecheck failure.
  e2e-console:
    name: Console end to end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      # The mock is the device under test here; it needs nothing but the stdlib.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # --ignore-scripts: this job installs dependencies on a runner that then
      # executes them, so a compromised package's postinstall would run with the
      # workspace in reach. Verified safe here -- esbuild resolves its platform
      # binary through optionalDependencies rather than a postinstall, and the
      # Playwright CLI is a plain bin, so both work without lifecycle scripts.
      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile --ignore-scripts

      # `bun run`, not `bunx`: bunx fetches a package on demand at whatever
      # version it resolves, while this runs the playwright already pinned by
      # bun.lock and just installed above.
      - name: Install browsers
        working-directory: web
        run: bun run e2e:browsers

      - name: Run the suite
        working-directory: web
        run: bun run test:e2e

      # Traces and screenshots for whatever failed. Without these a red run in
      # CI is far harder to read than the same failure locally.
      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  tests-native:
    name: Native unit tests (Unity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-firmware.txt

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.platformio
          key: pio-native-${{ runner.os }}-${{ hashFiles('firmware/arduino/platformio.ini') }}

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-firmware.txt

      # Host-side Unity tests for the pure-header logic: the auto-mode
      # thermostat and the OTA rollback decision. The script discovers every
      # [env:native*] in platformio.ini, so adding an env is enough.
      - name: Run native test envs
        run: bash scripts/test-native.sh

  tests-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the SonarCloud step below can resolve new-code scope
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # Pinned deliberately: an unpinned install added here trips
          # githubactions:S8544, and this is CI-only tooling.
          python -m pip install "pytest-cov==7.1.0"

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          # --cov writes coverage.xml for the SonarCloud step below. Collecting it
          # from this run rather than a second one keeps the suite executing once.
          pytest -q --cov=scripts --cov-report=xml 2>&1 | tee pytest-python.txt

      # Scanning from inside this job means coverage.xml is already in the
      # workspace: no artifact round-trip, and no second pytest run. always() so a
      # failing test still gets measured instead of leaving the gate at 0%.
      # The CI-driven SonarCloud scan step was removed 2026-08-10: its token
      # gate had it silently skipping since 2026-08-06, its bound project
      # (jtn0123_ESP32-Garage-Fan, sonar-project.properties) froze at that
      # date, and every Sonar check and PR comment since has come from
      # SonarCloud AUTOMATIC analysis (jtn0123_ESP32-Garage-Fan2, configured
      # by .sonarcloud.properties). One analysis pipeline, not a live one and
      # a dead one wearing the same name.
      - name: Upload test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-tests-artifacts
          if-no-files-found: ignore
          path: |
            pytest-python.txt
            coverage.xml

  lint:
    name: Lint (${{ matrix.tool }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [ruff, black, clang-format, cpplint, mypy]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install tool
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          case "${{ matrix.tool }}" in
            ruff)
              pip install ruff
              ;;
            black)
              pip install black
              ;;
            cpplint)
              pip install cpplint
              ;;
            mypy)
              pip install --only-binary :all: mypy==1.20.0
              ;;
            clang-format)
              sudo apt-get update
              sudo apt-get install -y clang-format
              ;;
          esac

      - name: Run ${{ matrix.tool }}
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.tool }}" in
            ruff)
              ruff check . 2>&1 | tee ruff.txt
              ;;
            black)
              black --check . 2>&1 | tee black.txt
              ;;
            clang-format)
              # generated_config.h is written by the PlatformIO pre-script, which
              # owns its formatting; it is also gitignored, so it is normally
              # absent here anyway.
              FILES=$(find firmware/arduino/src -type f \( -name "*.cpp" -o -name "*.h" \) \
                ! -name 'generated_*.h')
              if [ -n "$FILES" ]; then
                clang-format --version | tee clang-format-version.txt
                clang-format -n --Werror $FILES 2>&1 | tee clang-format.txt
              fi
              ;;
            mypy)
              # Strictness lives in pyproject.toml ([tool.mypy] has
              # disallow_untyped_defs); this stays a bare invocation so local
              # runs and CI cannot drift.
              mypy scripts/ 2>&1 | tee mypy.txt
              ;;
            cpplint)
              FILES=$(find firmware/arduino/src -type f \( -name "*.cpp" -o -name "*.h" \))
              if [ -n "$FILES" ]; then
                # Use CPPLINT.cfg for filters by default
                python -m cpplint $FILES 2>&1 | tee cpplint.txt
              fi
              ;;
          esac

      - name: Upload lint logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-logs-${{ matrix.tool }}
          if-no-files-found: ignore
          path: "*.txt"

  banned-functions:
    name: Check for banned C functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Check for banned functions
        run: python3 scripts/check_banned_functions.py
