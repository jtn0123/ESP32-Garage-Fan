name: Tag release from VERSION

# Why this exists: releasing was a manual `git tag`, and nobody ran it. The
# repo shipped v1.14.0 on 2026-08-09 and then went 22 versions without another
# tag while VERSION climbed to 1.14.22 -- so the console's update check, which
# is wired correctly end to end, spent that whole time comparing the running
# firmware against a release feed that had stopped moving. Every device in the
# field could only ever be offered v1.14.0.
#
# Tagging is now a consequence of bumping VERSION on main, which is the thing
# that actually marks a release-worthy change. release.yml still does the
# building and publishing; this only creates the tag that triggers it.

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'

# Creating a tag is a write to repository contents.
permissions:
  contents: read

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Create vX.Y.Z if it does not exist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read and validate VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < VERSION)
          # release.yml derives FW_VERSION from the tag and refuses to build if
          # it disagrees with VERSION. Catch a malformed value here instead, so
          # the failure names the real problem rather than surfacing as a
          # mismatch three steps into a release build.
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION is '$V', which is not a bare X.Y.Z. Not tagging."
            exit 1
          fi
          echo "v=$V" >> "$GITHUB_OUTPUT"

      - name: Create the tag unless it already exists
        shell: bash
        env:
          V: ${{ steps.ver.outputs.v }}
        run: |
          set -euo pipefail
          # Idempotent: re-running for an already-released version is a no-op
          # rather than an error, so a VERSION-touching revert or a re-run of
          # this workflow cannot fail the build or clobber a published tag.
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V already tagged; nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1; then
            echo "v$V already exists on origin; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "Release v$V"
          git push origin "v$V"
          echo "Tagged v$V -- release.yml will build and publish it."
