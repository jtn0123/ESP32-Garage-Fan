name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - "python"
          - "javascript-typescript"
          # "c-cpp" is intentionally absent: autobuild cannot build the PlatformIO
          # firmware, so the analysis step fails with "no source code was seen".
          # Same reason C/C++ is excluded from SonarCloud (needs a compilation
          # database). To re-enable, replace autobuild with an explicit `pio run`.
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # autobuild executes repository-controlled build logic; analysis needs
        # no authenticated git operations.
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
      with:
        languages: ${{ matrix.language }}
    - name: Autobuild
      uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
      with:
        category: "/language:${{ matrix.language }}"
