name: Release Firmware

on:
  push:
    tags:
      - 'v*.*.*'
  # Callable so tag-release.yml can build and publish directly after creating
  # the tag. It has to: a tag pushed with the default GITHUB_TOKEN does NOT
  # raise a `push` event, so the trigger above would never fire for an
  # automatically created tag and the release would silently never be built.
  # Calling this workflow keeps it in the same run, with no PAT to provision.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and publish, e.g. v1.14.23'
        required: true
        type: string

# The release job attaches binaries to a GitHub Release, which needs write
# access to repository contents. Scoped at job level rather than workflow level.
permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Build the tag's tree. Under workflow_call the default ref is the
          # caller's branch, which could have moved past the tag by the time
          # this runs -- the published binary must be the tagged commit.
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}

      # The tag and the VERSION file must agree, because the device reports
      # FW_VERSION and the update check compares exactly that against the newest
      # tag on GitHub. If they drift, every device in the field either sees a
      # phantom update forever or never sees a real one.
      - name: Derive FW_VERSION from tag and check it matches VERSION
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Either trigger: the workflow_call input when tag-release invoked us,
          # otherwise the pushed ref.
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Strip leading 'v' if present for FW_VERSION canonical format
          FW=${TAG#v}
          FILE=$(tr -d '[:space:]' < VERSION)
          if [ "$FW" != "$FILE" ]; then
            echo "::error::tag $TAG implies version '$FW' but VERSION says '$FILE'."
            echo "Update VERSION and re-tag; a release where these disagree ships a"
            echo "binary that misreports itself to the update check."
            exit 1
          fi
          echo "fw_version=$FW" >> $GITHUB_OUTPUT

      - name: Build fan controller firmware
        env:
          FW_VERSION: ${{ steps.ver.outputs.fw_version }}
        run: |
          cd firmware/arduino
          pio run -e feather_esp32s2_fan_controller

      # Name the assets after the tag and publish a checksum beside each one.
      # The update check builds its download URL from the version string rather
      # than parsing the releases API's asset array, so the names have to be
      # predictable -- and the glob this replaced matched both firmware.bin and
      # firmware.factory.bin, leaving no way to tell which was the OTA image.
      #
      # The .sha256 sidecars are not decoration. Unlike an Android APK there is
      # no OS signature gate on the way in: /update accepts whatever bytes it is
      # handed. Without secure boot, the checksum is the only integrity check
      # between GitHub and the flash.
      - name: Stage release assets
        id: assets
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.fw_version }}
          BUILD=firmware/arduino/.pio/build/feather_esp32s2_fan_controller
          mkdir -p dist
          cp "$BUILD/firmware.bin"          "dist/garage-fan-v$V.bin"
          cp "$BUILD/firmware.factory.bin"  "dist/garage-fan-v$V.factory.bin"
          cp "$BUILD/firmware.elf"          "dist/garage-fan-v$V.elf"
          ( cd dist && for f in *.bin; do sha256sum "$f" > "$f.sha256"; done )
          ls -l dist

      # generated_config.h is deliberately NOT published here. It is the output
      # of scripts/gen_device_header.py and carries WIFI_SSID / WIFI_PASS /
      # MQTT_USER / MQTT_PASS inline; attaching it to a public release would
      # hand out the credentials with the binary. It builds empty on CI (no
      # .env in a clean checkout), but "empty today" is not a reason to ship the
      # path.
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-${{ steps.ver.outputs.fw_version }}
          path: dist/*

      # The update CHANNEL: the same OTA image and checksum, published a second
      # time to GitHub Pages. Release assets cannot be fetched by a browser from
      # another origin (github.com answers the asset download with no CORS
      # headers -- measured 2026-08-20: "Failed to fetch" from the console),
      # and the ESP32-S2 cannot fetch them itself (no TLS, see net/weather.h).
      # Pages serves everything with Access-Control-Allow-Origin: *, so the
      # console's one-click install (web/src/updater.ts) downloads from here,
      # verifies the checksum and hands the bytes to /update. Only the newest
      # release lives on the channel; the Release itself keeps every version.
      - name: Stage the update channel
        run: |
          set -euo pipefail
          V=${{ steps.ver.outputs.fw_version }}
          TAG=${{ steps.ver.outputs.tag }}
          mkdir -p site/firmware
          cp "dist/garage-fan-v$V.bin" "dist/garage-fan-v$V.bin.sha256" site/firmware/
          SUM=$(cut -d' ' -f1 "dist/garage-fan-v$V.bin.sha256")
          SIZE=$(wc -c < "dist/garage-fan-v$V.bin" | tr -d ' ')
          printf '{"version":"%s","tag":"%s","bin":"%s","sha256":"%s","size":%s,"published":"%s"}\n' \
            "$V" "$TAG" "garage-fan-v$V.bin" "$SUM" "$SIZE" "$(date -u +%FT%TZ)" \
            > site/firmware/manifest.json
          printf '<!doctype html><title>garage-fan update channel</title><p>Firmware update channel for <a href="https://github.com/%s">%s</a>. Latest: %s.</p>\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$TAG" > site/index.html
          cat site/firmware/manifest.json

      # SHA-pinned per githubactions:S7637 — see the other third-party actions.
      - name: Upload the update channel
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      # SHA-pinned per githubactions:S7637 — see the other third-party actions.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # steps.ver.outputs.tag, not github.ref_name: under workflow_call the
          # ref is the caller's branch (main), which would publish the release
          # against the wrong target entirely.
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Release ${{ steps.ver.outputs.tag }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the update channel staged above. Separate job because Pages
  # deployment needs id-token:write and pages:write, which the release build
  # has no business holding.
  publish-channel:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # SHA-pinned per githubactions:S7637 — see the other third-party actions.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
