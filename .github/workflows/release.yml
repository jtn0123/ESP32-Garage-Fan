name: Release Firmware

on:
  push:
    tags:
      - 'v*.*.*'

# The release job attaches binaries to a GitHub Release, which needs write
# access to repository contents. Scoped at job level rather than workflow level.
permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}

      - name: Derive FW_VERSION from tag
        id: ver
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Strip leading 'v' if present for FW_VERSION canonical format
          FW=${TAG#v}
          echo "fw_version=$FW" >> $GITHUB_OUTPUT

      - name: Build fan controller firmware
        env:
          FW_VERSION: ${{ steps.ver.outputs.fw_version }}
        run: |
          cd firmware/arduino
          pio run -e feather_esp32s2_fan_controller

      # generated_config.h is deliberately NOT published here. It is the output
      # of scripts/gen_device_header.py and carries WIFI_SSID / WIFI_PASS /
      # MQTT_USER / MQTT_PASS inline; attaching it to a public release would
      # hand out the credentials with the binary. It builds empty on CI (no
      # .env in a clean checkout), but "empty today" is not a reason to ship the
      # path.
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firmware-${{ steps.ver.outputs.fw_version }}
          path: |
            firmware/arduino/.pio/build/**/firmware*.bin
            firmware/arduino/.pio/build/**/firmware*.elf

      # SHA-pinned per githubactions:S7637 — see the other third-party actions.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            firmware/arduino/.pio/build/**/firmware*.bin
            firmware/arduino/.pio/build/**/firmware*.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


