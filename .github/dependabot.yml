version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  # The fantape log reader. It has no dependencies today and the point is to
  # keep it that way, so this entry exists to notice if one ever arrives --
  # and to keep the Rust edition/toolchain honest if that changes.
  - package-ecosystem: "cargo"
    directory: "/tools/fantape"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # github/codeql-action ships as four separate sub-actions - init,
    # autobuild, analyze and upload-sarif - and CodeQL fails unless every
    # step in a workflow is on the same version. One PR per sub-action can
    # therefore never go green. Group them so the family moves together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

# There is no npm ecosystem entry: web/manager was the repo's only npm project
# and it belonged to the inherited room-node tooling, removed in the fan-only
# cleanup. Re-add one here if a JS project ever lands.
