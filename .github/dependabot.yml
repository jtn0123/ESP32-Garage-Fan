version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  # The fantape log reader. It has no dependencies today and the point is to
  # keep it that way, so this entry exists to notice if one ever arrives --
  # and to keep the Rust edition/toolchain honest if that changes.
  - package-ecosystem: "cargo"
    directory: "/tools/fantape"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # github/codeql-action ships as four separate sub-actions - init,
    # autobuild, analyze and upload-sarif - and CodeQL fails unless every
    # step in a workflow is on the same version. One PR per sub-action can
    # therefore never go green. Group them so the family moves together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # The console, managed by bun. The ecosystem is "bun", not "npm": the
  # npm_and_yarn updater used to read bun.lock, but now refuses a directory
  # with a bun.lock and no npm/yarn/pnpm lockfile ("Dependabot's npm_and_yarn
  # ecosystem cannot update bun.lock"), so every weekly run for /web failed
  # from 2026-09-30 and the console went unwatched again. The directory is /web,
  # not /, since that is where package.json lives.
  #
  # This entry was absent for a while: web/manager, the repo's only npm project
  # before the console, belonged to the inherited room-node tooling and went in
  # the fan-only cleanup. The comment saying to re-add one "if a JS project ever
  # lands" outlived the landing -- the console's six devDependencies (esbuild,
  # typescript, vitest, playwright, jsdom, @types/node) were watched by nobody.
  - package-ecosystem: "bun"
    directory: "/web"
    schedule:
      interval: "weekly"
    # One PR a week rather than six: these move together in practice, and each
    # one costs a full Playwright run to verify.
    groups:
      console-toolchain:
        patterns:
          - "*"
