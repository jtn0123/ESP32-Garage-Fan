# Read by SonarCloud AUTOMATIC ANALYSIS (the "-Fan2" project), which ignores
# sonar-project.properties -- that file configures only the CI-driven scan.
# Both projects follow the same decision, documented in
# sonar-project.properties: C/C++ is out of scope for Sonar here. The CI scan
# excludes it because it errors without the build-wrapper; automatic analysis
# "analyzes" it without compiler context and produces desktop-C++ style advice
# (std::string over char arrays, std::format, std::chrono) that is exactly
# backwards for a 320 KB-RAM microcontroller this project has already fought
# heap exhaustion on. Firmware quality is enforced where it has context:
# -Wall -Wextra with -Werror in CI, cpplint, clang-format, the wire-contract
# pytest, the native Unity suites, and PR review.
sonar.exclusions=**/__pycache__/**,**/.pio/**,**/.venv/**,**/build/**,**/*.c,**/*.cpp,**/*.h,**/*.hpp
sonar.test.inclusions=**/test_*.py,**/tests/**
