sonar.projectKey=jtn0123_ESP32-Garage-Fan
sonar.organization=jtn0123ismysonar

sonar.sources=.
# C/C++ needs the SonarSource build-wrapper to analyze; without it the scanner
# errors on these rather than skipping them, so the firmware is excluded here.
sonar.exclusions=**/__pycache__/**,**/.pio/**,**/.venv/**,**/build/**,**/*.c,**/*.cpp,**/*.h,**/*.hpp
sonar.test.inclusions=**/test_*.py,**/tests/**

sonar.python.version=3.11,3.12

# Produced by the tests-python job in .github/workflows/ci.yml. Without it the
# quality gate reads 0% coverage on new code and fails every pull request
# regardless of content.
sonar.python.coverage.reportPaths=coverage.xml
