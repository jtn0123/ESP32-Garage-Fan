sonar.projectKey=jtn0123_ESP32-Temp-Sensor
sonar.organization=jtn0123ismysonar

sonar.sources=.
# Minified and vendored bundles are excluded from analysis, not just from coverage.
# SonarJS builds a full AST and control-flow graph per file, and web/sim/vendor/
# mqtt.min.js is 319 KB on a single 259,000-character line: the scan stalls on it
# for ~9 minutes (visible as "Analysis progress: 81% (18/22 files)" followed by a
# long silence), which dwarfs every other CI job. There is nothing actionable to
# report in third-party minified output anyway.
sonar.exclusions=**/__pycache__/**,**/node_modules/**,**/dist/**,**/.venv/**,**/build/**,**/*.c,**/*.cpp,**/*.h,**/*.hpp,**/vendor/**,**/*.min.js,**/*.min.css
sonar.test.inclusions=**/test_*.py,**/tests/**

sonar.python.version=3.11,3.12

# Produced by the tests-python job in .github/workflows/ci.yml and downloaded by
# the sonarcloud job there. Without it the quality gate reads 0% coverage on new
# code and fails every pull request regardless of content.
sonar.python.coverage.reportPaths=coverage.xml

# The web simulator and manager are exercised by the Playwright browser suite
# (tests/test_web_sim*.py, CI job "Web simulator tests"), but no JS coverage
# report exists - there is no JS test runner, so Sonar structurally reads 0%
# for any changed JS line and fails the new-code gate. Exclude JS from the
# coverage metric (not from analysis) until a vitest/jsdom setup produces
# lcov data that sonar.javascript.lcov.reportPaths can consume.
sonar.coverage.exclusions=web/**
